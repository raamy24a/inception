events {}

http {
    include /etc/nginx/mime.types;

    server {
        # Only listen on port 443 with SSL enabled[cite: 1]
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name radib.42.fr;

        # Enforce TLSv1.2 and TLSv1.3 only[cite: 1]
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /etc/nginx/ssl/inception.crt;
        ssl_certificate_key /etc/nginx/ssl/inception.key;

        # Point to the shared volume where WordPress will live[cite: 1]
        root /var/www/wordpress;
        index index.php index.html index.htm;

        location / {
            try_files $uri $uri/ =404;
        }

        # Route PHP requests to the WordPress container on port 9000
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass wordpress:9000;
        }
    }
}
